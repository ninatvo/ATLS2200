<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>My News App</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>News Dashboard</h1>
        <button id="darkModeToggle" class="dark-mode-btn">Dark Mode</button>
    </header>

    <div id="controls">
        <p>Search for a news topic:</p>
        <input type="text" id="topicInput" placeholder="Example: technology">
        <button id="searchBtn">Search</button>
        <button id="clearBtn">Clear Saved Topic</button>
    </div>

    <p id="status"></p>

    <div id="newsContainer">
    </div>

    <script src="script.js"></script>

</body>

</html>
