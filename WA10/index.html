<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app">
        <header><b>Inspirational Quote and Doggie Machine</b></header>
        <section class="quotes">
            <img id="dog" />
            <div class="quote-text" id="js-quote-text"></div>
            <div class="quote-text" id="js-author-text"></div>
        </section>
        <section class="controls">
            <button type="button" id="js-new-quote" class="new-quote button">
                Generate a new inspirational quote
            </button>
            <button type="button" id="js-tweet" class="twitter button">
                Show author
            </button>
            <button class="doggie button" onclick="showDog()">Generate a new doggie</button>
        </section>

    </div>
    <p id="paragraph"> 
        2 APIs: Inspirational Quotes API and Random Dog Photo API. <br>
        I would imagine using the YouTube Data API to generate random YouTube videos for a mock YouTube home page and potentially a mock algorithm.
    </p>
    <script src="script.js"></script>
</body>

</html>
