<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 200px;
            width: 200px;
            border: 5px black solid;
            background-color: red;
            animation-name: moving-box;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            /* makes position not absolute so box can move */
            position: relative; 
        }

        @keyframes moving-box {
            /* from = 0% */
            from { 
                left: 0px;
                top: 0px;
            }

            25% {
                left: 500px;
                top: 0px;
                background-color: blue;
            }

            50% {
                left: 500px;
                top: 500px;
                background-color: yellow;
            }

            75% {
                left: 0;
                top: 500px;
                background-color: green;
            }

            /* to = 100% */
            to {
                left: 0px;
                top: 0px;
                background-color: red;
            }
        }

        .box2 {
            height: 200px;
            width: 200px;
            border: 5px black solid;
            background-color: blue;
            /* we want to have a transition that affects the width */
            transition-property: width height background-color;
            transition-duration: 1s;
        }

        .box2:hover {
            width: 500px;
            height: 500px;
            background-color: pink;
        }

    </style>
</head>
<body>
    <div class="box">

    </div>

    <div class="box2"></div>
    <script>

    </script>
</body>
</html>
