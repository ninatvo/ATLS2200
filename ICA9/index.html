<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICA9</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=BBH+Sans+Hegarty&family=Lalezar&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&family=Syne:wght@400..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="center">
        <button>Press to Start</button>
        <div class="loading-container">
            <div class="loading"></div>
        </div>
        
    </div>

    <script>
        const button = document.querySelector("button");
        const loading = document.querySelector(".loading");

        button.addEventListener("click", () => {
            loading.classList.toggle("start");
        });
    </script>

</body>

</html>
